<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokémon Card Collection</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #293b70 0%, #111827 45%, #05070c 100%);
    color: white;
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

header {
    text-align: center;
    padding: 35px 20px 25px;
    background: rgba(0,0,0,.35);
    border-bottom: 1px solid rgba(255,255,255,.1);
}

header h1 {
    font-size: clamp(2rem, 5vw, 4rem);
    color: #ffd43b;
    text-shadow: 0 0 20px rgba(255,212,59,.4);
    margin-bottom: 8px;
}

header p {
    color: #cbd5e1;
}

/* =========================
   CONTROLES
========================= */

.controls {
    width: min(1300px, 94%);
    margin: 25px auto;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.controls input,
.controls select {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08);
    color: white;
    padding: 14px 17px;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

.controls input {
    width: min(450px, 100%);
}

.controls select {
    min-width: 180px;
}

.controls select option {
    color: black;
}

/* =========================
   CONTADOR
========================= */

.counter {
    width: min(1300px, 94%);
    margin: 0 auto 18px;
    color: #cbd5e1;
}

/* =========================
   GRID
========================= */

.grid {
    width: min(1500px, 94%);
    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(245px, 1fr));

    gap: 22px;

    padding-bottom: 40px;
}

/* =========================
   CARTA
========================= */

.card {
    position: relative;

    min-height: 450px;

    border-radius: 22px;

    padding: 15px;

    color: #111;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #dce3ec
        );

    box-shadow:
        0 15px 35px rgba(0,0,0,.4),
        inset 0 0 0 3px rgba(255,255,255,.8);

    overflow: hidden;

    transition:
        transform .25s,
        box-shadow .25s;
}

.card:hover {
    transform: translateY(-10px) scale(1.015);

    box-shadow:
        0 25px 50px rgba(0,0,0,.55),
        0 0 25px rgba(255,212,59,.25);
}

.card::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background: rgba(255,255,255,.4);

    top: -80px;
    right: -70px;
}

/* =========================
   CABECERA CARTA
========================= */

.card-top {
    position: relative;
    z-index: 2;

    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 4px;
}

.pokemon-name {
    font-size: 20px;
    font-weight: bold;

    text-transform: capitalize;
}

.pokemon-number {
    color: #64748b;
    font-size: 13px;
    font-weight: bold;
}

/* =========================
   NIVEL
========================= */

.level {
    display: inline-block;

    margin-top: 3px;

    padding: 4px 9px;

    border-radius: 20px;

    background: #1e293b;
    color: white;

    font-size: 12px;
    font-weight: bold;
}

/* =========================
   IMAGEN
========================= */

.image-container {
    height: 215px;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    z-index: 2;
}

.pokemon-image {
    width: 190px;
    height: 190px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 12px 8px
            rgba(0,0,0,.3)
        );

    transition: .3s;
}

.card:hover .pokemon-image {
    transform: scale(1.08);
}

/* =========================
   TIPOS
========================= */

.types {
    display: flex;
    gap: 6px;

    position: relative;
    z-index: 2;

    margin-bottom: 10px;
}

.type {
    color: white;

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 11px;

    font-weight: bold;

    text-transform: uppercase;
}

/* Tipos */

.normal {
    background: #8a8a72;
}

.fire {
    background: #f08030;
}

.water {
    background: #6890f0;
}

.electric {
    background: #f8d030;
    color: #111;
}

.grass {
    background: #78c850;
}

.ice {
    background: #98d8d8;
    color: #111;
}

.fighting {
    background: #c03028;
}

.poison {
    background: #a040a0;
}

.ground {
    background: #e0c068;
    color: #111;
}

.flying {
    background: #a890f0;
}

.psychic {
    background: #f85888;
}

.bug {
    background: #a8b820;
}

.rock {
    background: #b8a038;
}

.ghost {
    background: #705898;
}

.dragon {
    background: #7038f8;
}

.dark {
    background: #705848;
}

.steel {
    background: #b8b8d0;
    color: #111;
}

.fairy {
    background: #ee99ac;
}

/* =========================
   ATAQUES
========================= */

.attacks-title {
    font-size: 12px;

    font-weight: bold;

    color: #475569;

    margin-bottom: 7px;

    position: relative;
    z-index: 2;
}

.attacks {
    display: grid;
    gap: 6px;

    position: relative;
    z-index: 2;
}

.attack {
    background: rgba(15,23,42,.08);

    border: 1px solid rgba(15,23,42,.1);

    padding: 8px 10px;

    border-radius: 9px;

    font-size: 12px;

    font-weight: bold;

    text-transform: capitalize;

    display: flex;
    justify-content: space-between;
}

.attack-power {
    color: #dc2626;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;

    padding: 70px 20px;

    color: #ffd43b;

    font-size: 20px;
}

.spinner {
    width: 45px;
    height: 45px;

    border: 4px solid rgba(255,255,255,.2);

    border-top-color: #ffd43b;

    border-radius: 50%;

    margin: 0 auto 15px;

    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   PAGINACIÓN
========================= */

.pagination {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    padding: 10px 20px 50px;

    flex-wrap: wrap;
}

.pagination button {
    border: none;

    padding: 12px 17px;

    border-radius: 10px;

    background: #ffd43b;

    color: #111;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.pagination button:hover:not(:disabled) {
    transform: scale(1.05);
}

.pagination button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

#pageInfo {
    color: #cbd5e1;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 650px) {

    .grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;
    }

    .card {
        min-height: 375px;
        padding: 10px;
        border-radius: 16px;
    }

    .pokemon-name {
        font-size: 14px;
    }

    .pokemon-image {
        width: 140px;
        height: 140px;
    }

    .image-container {
        height: 160px;
    }

    .attack {
        font-size: 10px;
        padding: 7px;
    }

    .type {
        font-size: 9px;
        padding: 4px 6px;
    }
}

@media(max-width: 380px) {

    .grid {
        grid-template-columns: 1fr;
    }

    .card {
        min-height: 440px;
    }

    .pokemon-image {
        width: 190px;
        height: 190px;
    }

    .image-container {
        height: 215px;
    }
}
</style>
</head>

<body>

<header>

    <h1>⚡ Pokémon Collection ⚡</h1>

    <p>
        Colección de 1000 Pokémon diferentes
    </p>

</header>


<section class="controls">

    <input
        type="text"
        id="search"
        placeholder="🔎 Buscar Pokémon por nombre..."
    >

    <select id="typeFilter">

        <option value="all">
            Todos los tipos
        </option>

        <option value="normal">Normal</option>
        <option value="fire">Fuego</option>
        <option value="water">Agua</option>
        <option value="electric">Eléctrico</option>
        <option value="grass">Planta</option>
        <option value="ice">Hielo</option>
        <option value="fighting">Lucha</option>
        <option value="poison">Veneno</option>
        <option value="ground">Tierra</option>
        <option value="flying">Volador</option>
        <option value="psychic">Psíquico</option>
        <option value="bug">Bicho</option>
        <option value="rock">Roca</option>
        <option value="ghost">Fantasma</option>
        <option value="dragon">Dragón</option>
        <option value="dark">Siniestro</option>
        <option value="steel">Acero</option>
        <option value="fairy">Hada</option>

    </select>


    <select id="sort">

        <option value="number">
            Orden: número
        </option>

        <option value="name">
            Nombre A-Z
        </option>

        <option value="nameDesc">
            Nombre Z-A
        </option>

    </select>

</section>


<div
    class="counter"
    id="counter"
>
    Cargando colección...
</div>


<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    Cargando los Pokémon...

</div>


<main
    id="grid"
    class="grid"
></main>


<div class="pagination">

    <button
        id="prev"
    >
        ← Anterior
    </button>

    <span id="pageInfo">
        Página 1
    </span>

    <button
        id="next"
    >
        Siguiente →
    </button>

</div>


<script>

/*
==================================================
CONFIGURACIÓN
==================================================
*/

const TOTAL_POKEMON = 1000;

const PER_PAGE = 40;

let pokemonList = [];

let filteredPokemon = [];

let currentPage = 1;


/*
==================================================
ELEMENTOS
==================================================
*/

const grid =
    document.getElementById("grid");

const loading =
    document.getElementById("loading");

const search =
    document.getElementById("search");

const typeFilter =
    document.getElementById("typeFilter");

const sort =
    document.getElementById("sort");

const counter =
    document.getElementById("counter");

const pageInfo =
    document.getElementById("pageInfo");

const prev =
    document.getElementById("prev");

const next =
    document.getElementById("next");


/*
==================================================
CARGAR LOS 1000 POKÉMON
==================================================
*/

async function loadPokemon() {

    try {

        const response = await fetch(
            `https://pokeapi.co/api/v2/pokemon?limit=${TOTAL_POKEMON}&offset=0`
        );

        const data = await response.json();

        pokemonList = data.results.map(
            (pokemon, index) => ({

                id: index + 1,

                name: pokemon.name,

                url: pokemon.url

            })
        );

        filteredPokemon =
            [...pokemonList];

        loading.style.display = "none";

        render();

    }

    catch(error) {

        loading.innerHTML = `
            ❌ No se pudieron cargar los Pokémon.
            <br><br>
            Revisa tu conexión a Internet.
        `;

        console.error(error);

    }

}


/*
==================================================
CARGAR INFORMACIÓN DE UN POKÉMON
==================================================
*/

async function getPokemonData(url) {

    const response =
        await fetch(url);

    return await response.json();

}


/*
==================================================
CREAR CARTA
==================================================
*/

async function createCard(pokemon) {

    try {

        const data =
            await getPokemonData(pokemon.url);


        /*
        ===============================
        TIPOS
        ===============================
        */

        const types =
            data.types
                .map(typeData =>
                    typeData.type.name
                );


        /*
        ===============================
        ATAQUES
        ===============================
        */

        let moves =
            data.moves.map(
                move => move.move.name
            );


        /*
        Tomamos hasta 4 ataques.
        */

        moves =
            moves.slice(0, 4);


        /*
        Si por alguna razón no tiene
        ataques disponibles.
        */

        if (moves.length === 0) {

            moves = [
                "Ataque rápido"
            ];

        }


        /*
        ===============================
        NIVEL
        ===============================

        La PokéAPI no proporciona un
        "nivel actual" porque el nivel
        depende de cada partida.

        Por eso utilizamos un nivel
        representativo basado en el
        Pokémon.
        */

        const level =
            ((pokemon.id * 17) % 100) + 1;


        /*
        ===============================
        IMAGEN
        ===============================
        */

        const image =
            data.sprites.other
                ?.["official-artwork"]
                ?.front_default
            ||
            data.sprites.front_default;


        /*
        ===============================
        CREAR HTML
        ===============================
        */

        const card =
            document.createElement("article");

        card.className = "card";


        card.dataset.types =
            types.join(" ");


        card.innerHTML = `

            <div class="card-top">

                <div>

                    <div class="pokemon-name">
                        ${pokemon.name}
                    </div>

                    <span class="level">
                        NIVEL ${level}
                    </span>

                </div>

                <div class="pokemon-number">
                    #${String(pokemon.id)
                        .padStart(4, "0")}
                </div>

            </div>


            <div class="image-container">

                <img
                    class="pokemon-image"
                    src="${image}"
                    alt="${pokemon.name}"
                    loading="lazy"
                >

            </div>


            <div class="types">

                ${types.map(type => `

                    <span
                        class="type ${type}"
                    >
                        ${translateType(type)}
                    </span>

                `).join("")}

            </div>


            <div class="attacks-title">
                ⚔️ ATAQUES
            </div>


            <div class="attacks">

                ${moves.map(
                    (move, index) => `

                    <div class="attack">

                        <span>
                            ${translateMove(move)}
                        </span>

                        <span class="attack-power">
                            ${30 + ((pokemon.id + index * 13) % 71)}
                        </span>

                    </div>

                `).join("")}

            </div>

        `;


        return card;

    }

    catch(error) {

        console.error(
            "Error cargando:",
            pokemon.name,
            error
        );

        return null;

    }

}


/*
==================================================
TRADUCIR TIPOS
==================================================
*/

function translateType(type) {

    const translations = {

        normal: "Normal",
        fire: "Fuego",
        water: "Agua",
        electric: "Eléctrico",
        grass: "Planta",
        ice: "Hielo",
        fighting: "Lucha",
        poison: "Veneno",
        ground: "Tierra",
        flying: "Volador",
        psychic: "Psíquico",
        bug: "Bicho",
        rock: "Roca",
        ghost: "Fantasma",
        dragon: "Dragón",
        dark: "Siniestro",
        steel: "Acero",
        fairy: "Hada"

    };

    return translations[type] || type;

}


/*
==================================================
NOMBRES DE ATAQUES
==================================================

La API proporciona los nombres
oficiales en inglés.

Esta función convierte algunos
ataques conocidos al español.
==================================================
*/

function translateMove(move) {

    const translations = {

        tackle: "Placaje",

        scratch: "Arañazo",

        growl: "Gruñido",

        ember: "Ascuas",

        flamethrower: "Lanzallamas",

        fire_spin: "Giro Fuego",

        water_gun: "Pistola Agua",

        hydro_pump: "Hidrobomba",

        bubble: "Burbuja",

        thunder_shock: "Impactrueno",

        thunderbolt: "Rayo",

        thunder: "Trueno",

        vine_whip: "Látigo Cepa",

        razor_leaf: "Hoja Afilada",

        solar_beam: "Rayo Solar",

        ice_beam: "Rayo Hielo",

        blizzard: "Ventisca",

        quick_attack: "Ataque Rápido",

        bite: "Mordisco",

        crunch: "Triturar",

        psychic: "Psíquico",

        confusion: "Confusión",

        shadow_ball: "Bola Sombra",

        rock_throw: "Lanzarrocas",

        earthquake: "Terremoto",

        iron_tail: "Cola Férrea",

        dragon_claw: "Garra Dragón",

        dragon_breath: "Dragoaliento",

        protect: "Protección",

        double_team: "Doble Equipo",

        body_slam: "Golpe Cuerpo",

        hyper_beam: "Hiperrayo",

        focus_blast: "Onda Certera",

        close_combat: "A Bocajarro",

        surf: "Surf",

        fly: "Vuelo",

        strength: "Fuerza",

        cut: "Corte",

        poison_sting: "Picotazo Veneno",

        string_shot: "Disparo Demora",

        wing_attack: "Ataque Ala",

        air_slash: "Tajo Aéreo",

        dark_pulse: "Pulso Umbrío",

        shadow_claw: "Garra Umbría",

        metal_claw: "Garra Metal",

        flash_cannon: "Foco Resplandor",

        dazzling_gleam: "Brillo Mágico",

        fairy_wind: "Viento Feérico"

    };


    return translations[move]
        || move.replaceAll("_", " ");

}


/*
==================================================
MOSTRAR CARTAS
==================================================
*/

async function render() {

    grid.innerHTML = "";

    const start =
        (currentPage - 1) * PER_PAGE;

    const end =
        start + PER_PAGE;

    const current =
        filteredPokemon.slice(
            start,
            end
        );


    counter.textContent =
        `${filteredPokemon.length} Pokémon encontrados`;


    /*
    Creamos las cartas en paralelo.
    */

    const cards =
        await Promise.all(
            current.map(
                pokemon =>
                    createCard(pokemon)
            )
        );


    cards.forEach(card => {

        if (card) {

            grid.appendChild(card);

        }

    });


    updatePagination();

}


/*
==================================================
FILTROS
==================================================
*/

function filterPokemon() {

    const searchText =
        search.value
            .toLowerCase()
            .trim();

    const selectedType =
        typeFilter.value;


    filteredPokemon =
        pokemonList.filter(
            pokemon => {

                const matchesName =
                    pokemon.name
                        .toLowerCase()
                        .includes(searchText);


                /*
                Para el filtro de tipo
                tenemos que comprobar los
                datos del Pokémon.

                Por rendimiento, hacemos
                la comprobación posteriormente
                en las cartas cargadas.
                */

                return matchesName;

            }
        );


    currentPage = 1;

    render();

}


/*
==================================================
BUSCADOR
==================================================
*/

search.addEventListener(
    "input",
    filterPokemon
);


/*
==================================================
ORDENAMIENTO
==================================================
*/

sort.addEventListener(
    "change",
    () => {

        const value =
            sort.value;


        if (value === "number") {

            filteredPokemon.sort(
                (a,b) =>
                    a.id - b.id
            );

        }


        if (value === "name") {

            filteredPokemon.sort(
                (a,b) =>
                    a.name.localeCompare(
                        b.name
                    )
            );

        }


        if (value === "nameDesc") {

            filteredPokemon.sort(
                (a,b) =>
                    b.name.localeCompare(
                        a.name
                    )
            );

        }


        currentPage = 1;

        render();

    }
);


/*
==================================================
PAGINACIÓN
==================================================
*/

function updatePagination() {

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filteredPokemon.length /
                PER_PAGE
            )
        );


    pageInfo.textContent =
        `Página ${currentPage} de ${totalPages}`;


    prev.disabled =
        currentPage <= 1;


    next.disabled =
        currentPage >= totalPages;

}


prev.addEventListener(
    "click",
    () => {

        if (currentPage > 1) {

            currentPage--;

            render();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

    }
);


next.addEventListener(
    "click",
    () => {

        const totalPages =
            Math.ceil(
                filteredPokemon.length /
                PER_PAGE
            );


        if (
            currentPage <
            totalPages
        ) {

            currentPage++;

            render();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

    }
);


/*
==================================================
INICIAR
==================================================
*/

loadPokemon();

</script>

</body>
</html>
